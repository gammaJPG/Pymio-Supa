<section class="tab-panel" id="tab-inventario">
  <header class="page-intro"><p class="eyebrow">Tu inventario</p><h2>Todo en su lugar.</h2><p>Consulta tus productos y mantén el control del stock.</p></header>
  <div class="chip-row" aria-label="Resumen del inventario"><div class="chip-card"><span class="kpi-label">Productos</span><strong class="kpi-value">—</strong></div><div class="chip-card"><span class="kpi-label">Valor del inventario</span><strong class="kpi-value">—</strong></div><div class="chip-card"><span class="kpi-label">Stock bajo</span><strong class="kpi-value">—</strong></div><div class="chip-card"><span class="kpi-label">Agotados</span><strong class="kpi-value">—</strong></div></div><div class="toolbar">
    <input id="inv-search" type="search"
           placeholder="Buscar producto o SKU" aria-label="Buscar producto o SKU">
    <label for="inv-category">Categoría</label>
    <select id="inv-category"><option value="">Todas las categorías</option></select>

  </div>

  <div style="overflow-x:auto">
    <table>
      <thead>
        <tr>

          <th aria-sort="none"><button type="button" class="inv-sort" data-sort="name" data-type="texto">Producto <span aria-hidden="true">↕</span></button></th>
          <th aria-sort="none"><button type="button" class="inv-sort" data-sort="sku" data-type="texto">SKU <span aria-hidden="true">↕</span></button></th>
          <th aria-sort="none"><button type="button" class="inv-sort" data-sort="category" data-type="texto">Categoría <span aria-hidden="true">↕</span></button></th>
          <th aria-sort="none"><button type="button" class="inv-sort" data-sort="qty" data-type="numero">Cantidad <span aria-hidden="true">↕</span></button></th>
          <th aria-sort="none"><button type="button" class="inv-sort" data-sort="price" data-type="numero">Precio <span aria-hidden="true">↕</span></button></th>
          <th aria-sort="none"><button type="button" class="inv-sort" data-sort="cost" data-type="numero">Costo <span aria-hidden="true">↕</span></button></th>
          <th aria-sort="none"><button type="button" class="inv-sort" data-sort="updated_at" data-type="fecha">Actualizado <span aria-hidden="true">↕</span></button></th>
          <th aria-sort="none"><button type="button" class="inv-sort" data-sort="created_at" data-type="fecha">Creado <span aria-hidden="true">↕</span></button></th>
        </tr>
      </thead>
      <tbody id="inv-table"></tbody>
    </table>
  </div>
  <div class="inventario-menu" data-category-menu>
    <button type="button" class="btn-secondary" data-category-toggle aria-label="Gestionar categorías" aria-expanded="false" aria-controls="category-options">+ Categoría</button>
    <div class="inventario-opciones" id="category-options" hidden>
      <button type="button" data-category-action="crear">Crear categoría</button>
      <button type="button" data-category-action="modificar">Modificar categoría</button>
      <button type="button" data-category-action="eliminar">Eliminar categoría</button>
    </div>
  </div>
  <dialog id="categoria-dialogo" class="producto-dialogo" aria-labelledby="categoria-titulo">
    <form>
      <h2 id="categoria-titulo">Crear categoría</h2>
      <div class="field" data-category-selector-wrap hidden><label for="categoria-selector">Categoría existente</label><select id="categoria-selector"></select></div>
      <div class="field" data-category-name-wrap><label for="categoria-nombre">Nombre</label><input id="categoria-nombre" maxlength="120" required></div>
      <p data-category-info>La sigla y las fechas se generan automáticamente.</p>
      <p class="producto-error" data-category-error role="alert" hidden></p>
      <div class="producto-acciones"><button type="button" class="btn-secondary" data-category-cancel>Cancelar</button><button type="submit" class="btn-primary">Crear categoría</button></div>
    </form>
  </dialog>
</section>
