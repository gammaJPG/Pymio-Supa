name: Desplegar Pymio en Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "pymio2/Pymio-main/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: pymio-cloudflare-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pymio2/Pymio-main

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            pymio2/Pymio-main/package-lock.json
            pymio2/Pymio-main/servidor/package-lock.json

      - name: Instalar dependencias de despliegue
        run: npm ci

      - name: Instalar dependencias del servidor
        run: npm ci --prefix servidor

      - name: Ejecutar pruebas
        run: npm test

      - name: Desplegar en Cloudflare Workers
        run: npm run deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
